services:
  ssh-alpha:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: mutagen-test-alpha
    ports:
      - "2221:2222"
    environment:
      - USER_NAME=mutagen
      - PUBLIC_KEY_FILE=/pubkey/id_ed25519.pub
      - SUDO_ACCESS=false
      - PASSWORD_ACCESS=false
    volumes:
      - ./keys:/pubkey:ro
      - alpha-sync:/sync
    restart: "no"

  ssh-beta:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: mutagen-test-beta
    ports:
      - "2222:2222"
    environment:
      - USER_NAME=mutagen
      - PUBLIC_KEY_FILE=/pubkey/id_ed25519.pub
      - SUDO_ACCESS=false
      - PASSWORD_ACCESS=false
    volumes:
      - ./keys:/pubkey:ro
      - beta-sync:/sync
    restart: "no"

volumes:
  alpha-sync:
  beta-sync:
